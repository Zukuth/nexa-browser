<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Nexa Browser</title>
<!-- Same defense-in-depth CSP the app's other three documents carry
     (index.html, permission-prompt.html, screenshot-editor.html). This page
     was the only one without one, purely because its script used to be
     inline; it lives in popout.js now so 'self' covers it. The <webview>
     guest is a separate document and is not governed by this policy — see
     its own contextIsolation/sandbox attributes in popout.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #111318; }
  webview { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
<script src="popout.js"></script>
</body>
</html>
