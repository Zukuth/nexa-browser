<!doctype html>
<!-- Exercises extractElementAtPointScript (right-click "Traducir este
     texto") — two paragraphs at fixed, known screen positions so a test
     can target exactly ONE via document.elementFromPoint coordinates and
     confirm the OTHER is left completely untouched. -->
<html lang="en">
<head><meta charset="utf-8"><title>Selection translate fixture</title></head>
<body>
  <p id="target" style="position:fixed; top:10px; left:10px; margin:0;">This paragraph should get translated.</p>
  <p id="other" style="position:fixed; top:300px; left:10px; margin:0;">This other paragraph must stay in English.</p>
</body>
</html>
