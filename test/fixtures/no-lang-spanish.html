<!doctype html>
<!-- Deliberately no lang attribute on <html> — exercises translate.js's
     content-based detection fallback (franc-min), not the <html lang> path
     every other translate fixture/test already covers. -->
<html>
<head><meta charset="utf-8"><title>Sin idioma declarado</title></head>
<body>
  <p>Bienvenido al juego. Selecciona todos los artículos para venderlos rápido y sin complicaciones.</p>
  <p>Tu personaje ha subido de nivel. Revisa el inventario para ver los objetos nuevos que conseguiste.</p>
</body>
</html>
