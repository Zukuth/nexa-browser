name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # 22+ required — test/unit/store.test.js uses node:test's
          # mock.module() (--experimental-test-module-mocks, see package.json's
          # "test" script) to fake the 'electron' module before requiring
          # store.js. That API doesn't exist on Node 20, which is what this
          # workflow ran until now — confirmed live: CI failed with
          # "Cannot read properties of undefined (reading 'getPath')" at
          # store.js:5, since require('electron') silently returned the
          # unmocked stub. 24 matches what's verified locally.
          node-version: 24

      - run: npm ci

      - run: npm run lint

      # checkJs ya está en true en jsconfig.json: los 46 archivos de
      # electron/, src/ y scripts/ pasan limpios (era ~1.500 errores antes de
      # tiparlos, 77% de ellos en src/renderer.js). Con esto, un archivo nuevo
      # entra al chequeo solo, sin depender de que alguien se acuerde de
      # ponerle "// @ts-check" en la primera línea — ese comentario queda como
      # documentación, ya no como el interruptor.
      - run: npm run typecheck

      - run: npm run check:i18n

      - run: npm test

      # Electron needs a real display even for a GUI-less CI run — xvfb-run
      # provides a virtual X server for the E2E suite's actual app windows.
      - run: xvfb-run --auto-servernum npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  # Catches a broken Windows package (bad native dependency, an
  # electron-builder config regression) on every push instead of only when
  # someone cuts a release — build-windows.yml only runs on a version tag,
  # and test-build.yml (the full NSIS installer) is manual-only, so there was
  # previously zero automatic packaging signal between releases. --dir skips
  # NSIS/signing/compression entirely (no certificate needed, none is
  # configured yet anyway) — just enough to prove the app still packages.
  build-check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: npx electron-builder --dir --win --publish never
